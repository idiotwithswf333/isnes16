name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libnds and filesystem library
        run: dkp-pacman -S --needed --noconfirm nds-dev

      - name: Show toolchain layout (helps debug the first run)
        run: |
          ls "$DEVKITPRO" || true
          ls "$DEVKITPRO/calico/lib" "$DEVKITPRO/calico/bin" "$DEVKITPRO/libnds" 2>/dev/null || true

      - name: Find ARM7 binaries
        run: find "$DEVKITPRO" -name 'ds7*.elf' -o -name 'default.elf' -o -name '*.arm7' | head -20

      - name: Build
        run: make -j2
        env:
          PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - uses: actions/upload-artifact@v4
        with:
          name: dsisnes-nds
          path: dsisnes.nds
