name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4

      - name: Install libnds and filesystem library
        run: dkp-pacman -S --needed --noconfirm nds-dev

      - name: Build (official template rules)
        run: make

      - name: Make DS-mode and DSi-mode images
        run: |
          # official build = plain DS header (diagnostic)
          mv dsisnes.nds dsisnes_dsmode.nds
          echo "--- ndstool help (for DSi flag reference) ---"
          ndstool 2>&1 | head -80 || true
          echo "--- DSi-mode image ---"
          ndstool -c dsisnes.nds -9 dsisnes.elf \
            -7 "$DEVKITPRO/calico/bin/ds7_maine.elf" \
            -b icon.bmp "DSi SNES;SNES emulator;DSi only" \
            -g SNSD 01 DSISNES -z 80040000 -u 00030004
          echo "--- header unit code (offset 0x12) of both images ---"
          xxd -s 0x12 -l 1 dsisnes_dsmode.nds
          xxd -s 0x12 -l 1 dsisnes.nds
          ls -l *.nds

      - uses: actions/upload-artifact@v4
        with:
          name: dsisnes-nds
          path: |
            dsisnes.nds
            dsisnes_dsmode.nds
